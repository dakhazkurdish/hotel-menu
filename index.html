<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Digital Menu & Rooms</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --success-color: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
    }

    header {
      text-align: center;
      padding: 10px 0 15px;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--accent-color);
    }

    header p {
      color: var(--text-sub);
      margin-top: 4px;
      font-size: 0.85rem;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0 15px;
      -webkit-overflow-scrolling: touch;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* دیزاینا کاتان ب وێنە ڤە */
    .item-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #334155;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
      overflow: hidden;
    }

    .item-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .item-img {
      width: 85px;
      height: 85px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .item-details {
      flex-grow: 1;
    }

    .item-details h3 {
      margin: 0 0 6px 0;
      font-size: 1rem;
    }
