<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Digital Menu & Rooms</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --success-color: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
    }

    header {
      text-align: center;
      padding: 10px 0 15px;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--accent-color);
    }

    header p {
      color: var(--text-sub);
      margin-top: 4px;
      font-size: 0.85rem;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0 15px;
      -webkit-overflow-scrolling: touch;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .item-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      border: 1px solid #334155;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .item-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .item-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .item-content {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-details h3 {
      margin: 0 0 6px 0;
      font-size: 0.95rem;
    }

    .item-details p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.3;
    }

    .price {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.9rem;
      white-space: nowrap;
      margin-inline-start: 10px;
      text-align: end;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .modal-body {
      padding: 18px;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    html[dir="ltr"] .modal-close {
      left: auto;
      right: 10px;
    }

    .modal-title {
      font-size: 1.2rem;
      color: var(--accent-color);
      margin: 0 0 8px 0;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .modal-price {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--success-color);
      margin-bottom: 16px;
    }

    .enter-btn {
      width: 100%;
      background: var(--accent-color);
      border: none;
      color: #000;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }

    footer.contact-section {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }

    .contact-title {
      text-align: center;
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-main);
    }

    .contact-icon {
      font-size: 1.3rem;
      width: 30px;
      text-align: center;
    }

    .contact-info strong {
      display: block;
      font-size: 0.85rem;
    }

    .contact-info p {
      margin: 2px 0 0 0;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .wa-card {
      border-color: #166534;
    }
    .wa-card .contact-info strong {
      color: var(--success-color);
    }
  </style>

    function renderMenu() {
      const selected = data[currentLang];
      document.documentElement.dir = selected.dir;

      document.getElementById('hotel-name').innerText = selected.title;
      document.getElementById('hotel-subtitle').innerText = selected.subtitle;

      document.getElementById('contact-heading').innerText = selected.contactTitle;
      document.getElementById('label-phone').innerText = selected.phoneLabel;
      document.getElementById('label-wa').innerText = selected.waLabel;
      document.getElementById('sub-wa').innerText = selected.waSub;
      document.getElementById('label-location').innerText = selected.locLabel;
      document.getElementById('val-location').innerText = selected.locVal;

      document.getElementById('m-btn').innerText = modalTexts[currentLang].enterBtn;

      const catContainer = document.getElementById('cat-list');
      catContainer.innerHTML = selected.cats.map((c, i) => 
        `<button class="cat-btn ${i === activeCatIndex ? 'active' : ''}" onclick="selectCategory(${i})">${c}</button>`
      ).join('');

      const filteredItems = activeCatIndex === 0 
        ? selected.items 
        : selected.items.filter(item => item.cat === activeCatIndex);

      const itemContainer = document.getElementById('menu-items');
      itemContainer.innerHTML = filteredItems.map(item => `
        <div class="item-card" onclick="openModal(${item.id})">
          <img src="${item.img}" class="item-img" alt="${item.title}">
          <div class="item-content">
            <div class="item-details">
              <h3>${item.title}</h3>
              <p>${item.desc}</p>
            </div>
            <div class="price">${item.price}</div>
          </div>
        </div>
      `).join('');
    }

    function selectCategory(index) {
      activeCatIndex = index;
      renderMenu();
    }

    function changeLang(lang, el) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      if(el) el.classList.add('active');
      renderMenu();
    }

    function openModal(id) {
      const selected = data[currentLang];
      selectedItem = selected.items.find(item => item.id === id);
      
      if (selectedItem) {
        document.getElementById('m-img').src = selectedItem.img;
        document.getElementById('m-title').innerText = selectedItem.title;
        document.getElementById('m-desc').innerText = selectedItem.desc;
        document.getElementById('m-price').innerText = selectedItem.price;
        document.getElementById('itemModal').classList.add('active');
      }
    }

    function closeModal(e) {
      if (e.target.id === 'itemModal') {
        document.getElementById('itemModal').classList.remove('active');
      }
    }

    function closeModalDirect() {
      document.getElementById('itemModal').classList.remove('active');
    }

    function enterRoom() {
      if (selectedItem) {
        alert(modalTexts[currentLang].alertMsg + selectedItem.title);
        closeModalDirect();
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      renderMenu();
    });
  </script>
</body>
</html>
